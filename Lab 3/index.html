<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="todo-app">
    <h1>My To-Do List</h1>
    <div class="input-row">
      <input type="text" id="taskInput" placeholder="Add a new task..." aria-label="New task">
      <button id="addBtn" type="button">Add</button>
    </div>
    <p class="error-message" id="errorMessage" aria-live="polite"></p>
    <ul id="taskList" aria-label="Tasks"></ul>
    <p class="task-count" id="taskCount">0 tasks</p>
  </main>

  <!-- Choose the task script you are practicing: task-01.js through task-06.js. -->
  <script src="solutions/task-06.js"></script>
</body>
</html>
